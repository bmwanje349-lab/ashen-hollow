<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<title>Ashen Hollow</title>
<link rel="preload" href="assets/worlds.webp" as="image" type="image/webp">
<link rel="preload" href="assets/knight.png" as="image" type="image/png">
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;font-family:Georgia,serif}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
canvas{display:block;background:#000;touch-action:none}
#touch{position:fixed;inset:0;pointer-events:none}
#touch.hide{display:none}
#touch button{pointer-events:auto;position:absolute;border:1.5px solid rgba(190,210,255,.58);background:linear-gradient(145deg,rgba(25,34,58,.86),rgba(4,7,16,.90));color:#f0f4ff;font:bold 14px Georgia,serif;border-radius:50%;box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 8px 26px rgba(0,0,0,.38);backdrop-filter:blur(5px);touch-action:none;padding:0;outline:none;-webkit-user-select:none;user-select:none}
#touch button.on{background:linear-gradient(145deg,rgba(170,194,255,.82),rgba(64,89,150,.92));border-color:#fff;box-shadow:0 0 22px rgba(172,199,255,.42),inset 0 1px 0 rgba(255,255,255,.5)}
#bl{left:16px;bottom:30px;width:78px;height:78px;font-size:28px!important}
#br{left:108px;bottom:30px;width:78px;height:78px;font-size:28px!important}
#bu{left:62px;bottom:116px;width:56px;height:56px;font-size:20px!important}
#bd{left:62px;bottom:-30px;width:0;height:0;visibility:hidden}
#bj{right:128px;bottom:24px;width:80px;height:80px}
#ba{right:20px;bottom:28px;width:98px;height:98px;font-size:16px!important}
#bc{right:24px;bottom:136px;width:68px;height:68px;font-size:12px!important}
#bh{right:112px;bottom:112px;width:60px;height:60px;font-size:11px!important}
#bw{left:200px;bottom:36px;width:56px;height:56px;font-size:18px!important}
#rot{display:none;position:fixed;inset:0;background:#05070c;color:#e8eefc;align-items:center;justify-content:center;text-align:center;font:bold 22px Georgia,serif;z-index:9;padding:20px}
@media (orientation:portrait){#rot{display:flex}}
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="touch" class="hide">
  <button id="bl" data-k="left">&#9664;</button>
  <button id="br" data-k="right">&#9654;</button>
  <button id="bu" data-k="up">&#9650;</button>
  <button id="bw" data-k="down">&#9660;</button>
  <button id="bj" data-k="jump">JUMP</button>
  <button id="ba" data-k="atk">SWORD</button>
  <button id="bc" data-k="dash">DASH</button>
  <button id="bh" data-k="heal">FOCUS</button>
</div>
<div id="rot">Rotate your phone to landscape<br>to play ASHEN HOLLOW</div>
<script src="rooms.js"></script>
<script src="phys.js"></script>
<script src="data.js"></script>
<script src="ent.js"></script>
<script src="art.js"></script>
<script src="play.js"></script>
<script src="render.js"></script>
</body>
</html>
