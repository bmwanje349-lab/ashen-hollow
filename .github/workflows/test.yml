name: Ashen Hollow tests
on:
  push:
    branches: [main, visual-overhaul]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run reachability and gameplay regression tests
        run: npm test
